<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Adriana &amp; Non · ผังที่นั่งรวม (สำหรับทีมงาน) · Mahassajan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&family=Pinyon+Script&family=Prompt:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{--mauve:#C9A8AF;--mauve-deep:#9C7880;--plum:#5C4148;--ink:#4A3A3E;--muted:#8A7A7E;--ivory:#FBF8F6;--blush:#F4EBEC;--line:#E3D3D7;--accent:#A0785A}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Prompt',sans-serif;font-weight:300;color:var(--ink);background:#EDE6E7;-webkit-print-color-adjust:exact;print-color-adjust:exact}
@page{size:A4 portrait;margin:0}
.bar{position:sticky;top:0;z-index:5;background:var(--plum);color:#fff;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding:12px 16px;font-size:14px}
.bar button{font-family:'Prompt';font-size:15px;border:0;border-radius:999px;padding:10px 22px;background:#fff;color:var(--plum);cursor:pointer}
.bar small{opacity:.85}
.page{width:210mm;height:297mm;margin:16px auto;background:#fff;padding:13mm 13mm 11mm;position:relative;overflow:hidden;box-shadow:0 6px 30px rgba(92,65,72,.15);display:flex;flex-direction:column}
@media print{body{background:#fff}.bar{display:none}.page{margin:0;box-shadow:none;page-break-after:always;break-after:page}.page:last-child{page-break-after:auto}}
.ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:7px;margin-bottom:10px}
.ph img{height:17px}
.ph .t{text-align:right}
.ph .t b{display:block;font-family:'Josefin Sans';font-weight:400;letter-spacing:.24em;font-size:9px;text-transform:uppercase;color:var(--mauve-deep)}
.ph .t span{font-size:15px;color:var(--plum);font-weight:400}
.pf{margin-top:auto;padding-top:6px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:8.5px;color:var(--muted);font-family:'Josefin Sans';letter-spacing:.08em}
.sub{font-size:10.5px;color:var(--muted);margin:-4px 0 10px}

/* cover */
.cover{align-items:center;text-align:center}
.cover .logo{height:26px;margin:4mm auto 0}
.cover .ey{font-family:'Josefin Sans';letter-spacing:.32em;font-size:10px;color:var(--mauve-deep);text-transform:uppercase;margin-top:7mm}
.cover h1{font-family:'Pinyon Script',cursive;font-weight:400;font-size:56px;color:var(--plum);line-height:1.15}
.cover h1 span{color:var(--accent);font-size:.6em;padding:0 .1em}
.cover .when{font-family:'Josefin Sans';letter-spacing:.2em;font-size:11px;text-transform:uppercase;color:var(--ink)}
.cover .where{font-size:12px;color:var(--muted);margin-top:2px}
.cover .map{width:92mm;margin:5mm auto 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#FDFBFA}
.cover .map svg{display:block;width:100%;height:auto}
.stats{display:flex;gap:8px;justify-content:center;margin-top:5mm;flex-wrap:wrap}
.stats div{border:1px solid var(--line);border-radius:10px;padding:5px 12px;min-width:30mm}
.stats b{display:block;font-family:'Josefin Sans';font-weight:400;font-size:19px;color:var(--plum)}
.stats small{font-size:9.5px;color:var(--muted)}
.sched{margin-top:4mm;font-size:9.5px;color:var(--ink);columns:2;column-gap:10mm;text-align:left;width:150mm}
.sched div{break-inside:avoid;padding:1.5px 0}
.sched b{font-family:'Josefin Sans';font-weight:400;color:var(--plum);display:inline-block;width:20mm}

/* ceremony */
.stage{margin:2mm auto 0;width:52mm;text-align:center;border:1.2px solid var(--mauve-deep);background:#F2E6E9;border-radius:8px;padding:5px;color:var(--plum)}
.stage b{display:block;font-family:'Josefin Sans';font-weight:400;letter-spacing:.24em;font-size:11px}
.stage small{font-size:10px}
.cer{margin-top:6mm;display:grid;grid-template-columns:9mm repeat(6,1fr) 9mm repeat(6,1fr);gap:5px 3.5px;align-items:stretch}
.cer .rl{display:flex;align-items:center;justify-content:center;font-family:'Josefin Sans';font-size:10px;color:var(--mauve-deep);text-align:center;line-height:1.2}
.cer .ai{display:flex;align-items:center;justify-content:center;border-left:1px dashed var(--mauve-deep);border-right:1px dashed var(--mauve-deep);font-family:'Josefin Sans';font-size:10px;color:var(--mauve-deep)}
.cs{border:1px solid var(--line);border-radius:7px;min-height:26mm;padding:4px 3px;text-align:center;background:#FBF5F6;display:flex;flex-direction:column;justify-content:center}
.cs i{font-style:normal;font-family:'Josefin Sans';font-size:8.5px;color:var(--mauve-deep);letter-spacing:.06em}
.cs span{font-size:8.8px;line-height:1.25;color:var(--plum);word-break:normal;overflow-wrap:anywhere}
.cs.v{background:#fff;border-style:dashed}
.cs.v span{color:#C9BABD}
.side-h{display:grid;grid-template-columns:9mm 1fr 9mm 1fr;margin-top:5mm;font-size:10.5px;color:var(--plum);text-align:center}
.side-h small{display:block;font-size:9px;color:var(--muted)}
.note{font-size:9.5px;color:var(--muted);margin-top:4mm;line-height:1.6}

/* long tables */
.lt-wrap{display:flex;justify-content:space-around;align-items:flex-start;gap:4mm;margin-top:5mm}
.lt{display:flex;flex-direction:column;align-items:center}
.lt h4{font-weight:400;font-size:12px;color:var(--plum);text-align:center;margin-bottom:3px}
.lt h4 small{display:block;font-family:'Josefin Sans';font-size:9px;color:var(--muted);letter-spacing:.06em}
.lt .grid{display:grid;grid-template-columns:auto 6mm 4mm 6mm auto;column-gap:1.5px}
.lt .nm{font-size:10.4px;line-height:1;display:flex;align-items:center;white-space:nowrap;color:var(--ink)}
.lt .nm.l{justify-content:flex-end;padding-right:2px;text-align:right}
.lt .nm.r{padding-left:2px}
.lt .nm.v{color:#C9BABD}
.lt .no{display:flex;align-items:center;justify-content:center}
.lt .no b{display:grid;place-items:center;width:5.4mm;height:5.4mm;border-radius:50%;background:#EBDCE0;font-family:'Josefin Sans';font-weight:400;font-size:7.5px;color:var(--plum)}
.lt .no.v b{background:#fff;border:1px dashed #D5C3C7;color:#B9AAAD}
.lt .tbl{background:#F4ECEE;border:1px solid #D7C3C8;border-radius:3px}
.lt .extra{font-size:9px;color:#A8552F;margin-top:3px;text-align:center}
.z1 .grid{grid-auto-rows:9.6mm}
.zz .grid{grid-auto-rows:9.4mm}
.zz .nm{font-size:9.4px}
.zone .lt-wrap{gap:2mm}
.zone{margin-top:4mm;border:1px solid var(--line);border-radius:10px;padding:4mm 3mm 3mm}
.zone h3{font-family:'Josefin Sans';font-weight:400;letter-spacing:.24em;font-size:12px;color:var(--mauve-deep);text-align:center}
.zone h3 small{letter-spacing:0;font-family:'Prompt';font-size:10px;color:var(--muted);margin-left:6px}
.zone .lt-wrap{margin-top:3mm}
.buffet{margin:5mm auto 0;width:110mm;text-align:center;border:1px solid #C9B48E;background:#EFE6D3;border-radius:5px;font-size:10px;padding:3px}

/* list */
table.list{width:100%;border-collapse:collapse;font-size:9.6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:6mm}
table.list th{font-weight:400;text-align:left;font-family:'Josefin Sans';letter-spacing:.12em;font-size:8px;text-transform:uppercase;color:var(--mauve-deep);border-bottom:1px solid var(--mauve);padding:3px 3px}
table.list td{padding:2.6px 3px;border-bottom:1px solid #F0E6E8;vertical-align:top}
table.list td.n{color:var(--plum);font-weight:400}
table.list td.c{font-family:'Josefin Sans';white-space:nowrap}
table.list tr:nth-child(even) td{background:#FCF9F9}
.flag{color:#A8552F}
.issues h3{font-weight:400;font-size:13px;color:var(--plum);margin:4mm 0 2mm}
.issues ul{padding-left:5mm;font-size:10.5px;line-height:1.7}
</style>
<link rel="stylesheet" href="plans.css">
</head>
<body>
<div class="bar"><button onclick="window.print()">🖨 พิมพ์ / บันทึกเป็น PDF</button><small>ในหน้าต่างพิมพ์ เลือก Destination: Save as PDF · กระดาษ A4 · เปิด Background graphics</small></div>
<div id="pages"></div>

<script src="data.js"></script>
<script src="plans.js"></script>
<script>
const {D, TBY, buildVenue, cerInfo, CER_CODES} = window.PLAN;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bySeat={};D.guests.forEach(g=>g.seats.forEach(s=>bySeat[s]=g));
const byCer={};D.guests.forEach(g=>{if(g.cer)byCer[g.cer]=g;});
const cerName=g=>g.alias.length?g.alias[0]:g.name;   // the name as written in the ceremony file
const unseated=D.guests.filter(g=>g.table&&!g.seats.length);
const pagesEl=document.getElementById('pages');
const today=new Date().toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});
let pageNo=0;
function page(title,body,cls=''){
  pageNo++;
  const d=document.createElement('section');d.className='page '+cls;
  d.innerHTML=(cls.includes('cover')?'':`<div class="ph"><img src="img/logo-mauve.png" alt="Mahassajan"><div class="t"><b>Adriana &amp; Non · 15 Nov 2026 · Thames Valley Khao Yai</b><span>${title}</span></div></div>`)
    +body+`<div class="pf"><span>MAHASSAJAN WEDDING PLANNER · สำหรับทีมงาน</span><span>พิมพ์เมื่อ ${today} · หน้า ${pageNo}</span></div>`;
  pagesEl.appendChild(d);return d;
}

/* ---------- 1. Cover ---------- */
const recCount=D.guests.reduce((a,g)=>a+g.seats.length,0), capAll=D.tables.reduce((a,t)=>a+t.cap,0);
const cerCount=Object.values(D.ceremony).filter(Boolean).length;
const zoneSum=z=>{const ts=D.tables.filter(t=>t.zone===z);return `${ts.reduce((a,t)=>a+t.cap,0)}`;};
const cov=page('', `
  <img class="logo" src="img/logo-mauve.png" alt="Mahassajan">
  <div class="ey">Seating plan · ผังที่นั่งรวม</div>
  <h1>Adriana<span>&amp;</span>Non</h1>
  <div class="when">Sunday · 15 November 2026</div>
  <div class="where">Thames Valley Khao Yai · โรงแรมเทมส์ วัลลีย์ เขาใหญ่</div>
  <div class="stats">
    <div><b>${cerCount}/${CER_CODES.length}</b><small>ที่นั่งพิธี (มีชื่อ)</small></div>
    <div><b>${recCount}/${capAll}</b><small>ที่นั่งงานเลี้ยง (มีชื่อ)</small></div>
    <div><b>${zoneSum('1')} · ${zoneSum('2')} · ${zoneSum('3')}</b><small>Zone 1 · Zone 2 · Zone 3</small></div>
  </div>
  <div class="map" id="cov-map"></div>
  <div class="sched">
    <div><b>16:00</b>ต้อนรับแขก · Guest Arrival</div><div><b>16:30</b>พิธีแลกคำมั่นสัญญา · Vows</div>
    <div><b>17:00</b>ถ่ายภาพ &amp; Cocktail Hour</div><div><b>18:30</b>งานเลี้ยง &amp; First Dance</div>
    <div><b>18:45</b>Father–Daughter Dance</div><div><b>19:00</b>Thank-you Speeches</div>
    <div><b>19:09</b>Dinner (บุฟเฟต์ไทย)</div><div><b>20:00</b>Cake Cutting</div>
    <div><b>21:00–23:00</b>Afterparty</div>
  </div>`,'cover');
cov.querySelector('#cov-map').appendChild(buildVenue());

/* ---------- 2. Ceremony ---------- */
let cg='';
for(let r=1;r<=4;r++){
  cg+=`<div class="rl">แถว<br>${r}</div>`;
  for(let k=1;k<=6;k++){const c='L'+String((r-1)*6+k).padStart(2,'0'),g=byCer[c];
    cg+=`<div class="cs${g?'':' v'}"><i>${c}</i><span>${g?esc(cerName(g)):'ว่าง'}</span></div>`;}
  cg+=`<div class="ai">${r}</div>`;
  for(let k=1;k<=6;k++){const c='R'+String((r-1)*6+k).padStart(2,'0'),g=byCer[c];
    cg+=`<div class="cs${g?'':' v'}"><i>${c}</i><span>${g?esc(cerName(g)):'ว่าง'}</span></div>`;}
}
page('ผังที่นั่งพิธีแลกคำมั่นสัญญา · 16:30',`
  <div class="sub">มุมมองจากด้านหลังแถว หันหน้าเข้าเวที · แถว 1 อยู่ใกล้เวทีที่สุด · L06 และ R01 ติดทางเดินกลาง</div>
  <div class="stage"><b>STAGE</b><small>เวทีบ่าวสาว</small></div>
  <div class="side-h"><span></span><span>ฝั่งซ้าย<small>Left · L01 (ริมนอก) → L06 (ติดทางเดิน)</small></span><span></span><span>ฝั่งขวา<small>Right · R01 (ติดทางเดิน) → R06 (ริมนอก)</small></span></div>
  <div class="cer">${cg}</div>
  <div class="note">ทางเดินบ่าวสาวอยู่ตรงกลางระหว่างฝั่งซ้ายและขวา · ข้อมูลจากไฟล์ seat.xlsx (${cerCount} ชื่อ จาก ${CER_CODES.length} ที่นั่ง)</div>`);

/* ---------- long-table renderer ---------- */
function ltHTML(t,title){
  const n=t.rows;let g='';
  for(let i=0;i<n;i++){
    const ls=t.left[i],rs=t.right[i],lg=bySeat[ls],rg=bySeat[rs];
    const L=ls==null?'<div></div><div></div>':`<div class="nm l${lg?'':' v'}">${lg?esc(lg.name):'ว่าง'}</div><div class="no${lg?'':' v'}"><b>${ls}</b></div>`;
    const R=rs==null?'<div></div><div></div>':`<div class="no${rg?'':' v'}"><b>${rs}</b></div><div class="nm r${rg?'':' v'}">${rg?esc(rg.name):'ว่าง'}</div>`;
    g+=L+(i===0?`<div class="tbl" style="grid-row:1/span ${n};grid-column:3"></div>`:'')+R;
  }
  const extra=D.guests.filter(x=>x.table===t.id&&!x.seats.length).map(x=>esc(x.name));
  const all=[...t.left,...t.right];
  return `<div class="lt"><h4>${title}<small>ที่ ${Math.min(...all)}–${Math.max(...all)} · ${t.cap} ที่นั่ง</small></h4><div class="grid">${g}</div>${extra.length?`<div class="extra">⚠ ไม่มีเลขที่นั่ง: ${extra.join(', ')}</div>`:''}</div>`;
}
// grid placement: left name col 1, left no col 2, table col 3, right no col 4, right name col 5 — rows auto-flow fill in order
const fixGrid=root=>root.querySelectorAll('.lt .grid').forEach(gr=>{let row=1,col=1;
  [...gr.children].forEach(c=>{if(c.classList.contains('tbl'))return;c.style.gridRow=row;c.style.gridColumn=col===3?4:col;col=col===2?4:col+1;if(col>5){col=1;row++;}});});

/* ---------- 3. Zone 1 ---------- */
const z1=page('งานเลี้ยง · Zone 1 · สนามหญ้า (Private Lawn) · 90 ที่นั่ง',`
  <div class="sub">โต๊ะยาว 3 แถว หันหน้าเข้าเวที · ฝั่งซ้าย/ขวา เมื่อหันหน้าเข้าเวที · ที่นั่งเรียงจากฝั่งเวทีลงไปทางไลน์อาหาร</div>
  <div class="stage"><b>STAGE</b><small>เวทีบ่าวสาว</small></div>
  <div class="lt-wrap z1">${D.tables.filter(t=>t.zone==='1').map(t=>ltHTML(t,'โต๊ะยาว '+t.label)).join('')}</div>
  <div class="buffet">ไลน์อาหาร (บุฟเฟต์) · Buffet</div>`);
fixGrid(z1);

/* ---------- 4. Zone 2 + 3 ---------- */
const zz=page('งานเลี้ยง · Zone 2 และ Zone 3',`
  <div class="sub">เรียงโต๊ะตามไฟล์ Excel ของบ่าวสาว (ซ้าย → ขวา) · เลขที่นั่งตามไฟล์</div>
  ${['2','3'].map(z=>`<div class="zone"><h3>ZONE ${z}<small>${zoneSum(z)} ที่นั่ง</small></h3>
    <div class="lt-wrap zz">${D.tables.filter(t=>t.zone===z).map(t=>ltHTML(t,t.label)).join('')}</div></div>`).join('')}`);
fixGrid(zz);

/* ---------- 5. Guest list A–Z ---------- */
const rows=[...D.guests].sort((a,b)=>a.name.localeCompare(b.name,'th'));
function recTxt(g){const t=TBY[g.table];if(!t)return '<span class="flag">— ไม่มีในไฟล์งานเลี้ยง</span>';
  const s=g.seats.length?g.seats.join(', '):'<span class="flag">ไม่มีเลข</span>';
  return `Z${t.zone} · ${t.zone==='1'?t.label:'โต๊ะ '+Math.min(...t.left,...t.right)+'–'+Math.max(...t.left,...t.right)} · <b>${s}</b>`;}
function cerTxt(g){if(!g.cer)return '–';const c=cerInfo(g.cer);return `${g.cer} <small style="color:var(--muted)">(${c.sideTh} แถว ${c.row})</small>`;}
const per=40;
for(let i=0;i<rows.length;i+=per*2){
  const mk=arr=>`<table class="list"><thead><tr><th>ชื่อ</th><th>พิธี</th><th>งานเลี้ยง</th></tr></thead><tbody>${arr.map(g=>`<tr><td class="n">${esc(g.name)}${g.alias.length?`<br><small style="color:var(--muted)">พิธี: ${esc(g.alias.join(', '))}</small>`:''}</td><td class="c">${cerTxt(g)}</td><td>${recTxt(g)}</td></tr>`).join('')}</tbody></table>`;
  page('รายชื่อแขกทั้งหมด (เรียงตามชื่อ) · '+rows.length+' รายการ',`<div class="cols">${mk(rows.slice(i,i+per))}${mk(rows.slice(i+per,i+per*2))}</div>`);
}

/* ---------- 6. Checklist ---------- */
const emptyRec=[];for(let s=1;s<=capAll;s++)if(!bySeat[s])emptyRec.push(s);
const emptyCer=CER_CODES.filter(c=>!D.ceremony[c]);
const cerOnly=D.guests.filter(g=>!g.table);
const dupNames=Object.entries(D.guests.reduce((m,g)=>(m[g.name]=(m[g.name]||0)+1,m),{})).filter(([,n])=>n>1).map(([n])=>n);
const aliasList=D.guests.filter(g=>g.alias.length);
page('รายการที่ทีมต้องเช็กหน้างาน',`<div class="issues">
  <h3>แขกที่ยังไม่มีเลขที่นั่งงานเลี้ยง (ชื่อเกินจำนวนที่นั่งของโต๊ะ)</h3>
  <ul>${unseated.map(g=>`<li>${esc(g.name)} — Zone ${TBY[g.table].zone} · ${TBY[g.table].label}</li>`).join('')||'<li>ไม่มี</li>'}</ul>
  <h3>ที่นั่งงานเลี้ยงที่ยังว่าง</h3><ul><li>${emptyRec.join(', ')||'ไม่มี'}</li></ul>
  <h3>ที่นั่งพิธีที่ยังว่าง</h3><ul><li>${emptyCer.join(', ')||'ไม่มี'}</li></ul>
  <h3>ชื่อที่มีเฉพาะในผังพิธี (ไม่พบในไฟล์งานเลี้ยง)</h3><ul>${cerOnly.map(g=>`<li>${esc(g.name)} — ${g.cer}</li>`).join('')||'<li>ไม่มี</li>'}</ul>
  <h3>ชื่อซ้ำ (คนละที่นั่ง)</h3><ul>${dupNames.map(n=>`<li>${esc(n)} — ที่ ${D.guests.filter(g=>g.name===n).map(g=>g.seats.join(',')).join(' และ ')}</li>`).join('')||'<li>ไม่มี</li>'}</ul>
  <h3>ชื่อในผังพิธีที่เขียนต่างจากไฟล์งานเลี้ยง (จับคู่เป็นคนเดียวกัน)</h3><ul>${aliasList.map(g=>`<li>${esc(g.alias.join(', '))} → ${esc(g.name)} (${g.cer})</li>`).join('')}</ul>
</div>`);
</script>
</body>
</html>
