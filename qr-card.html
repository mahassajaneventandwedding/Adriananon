<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>QR card · Adriana &amp; Non · Mahassajan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Prompt:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Prompt',sans-serif;font-weight:300;background:#EDE6E7;color:#5C4148;-webkit-print-color-adjust:exact;print-color-adjust:exact}
@page{size:A5 portrait;margin:0}
.bar{text-align:center;padding:12px;background:#5C4148;color:#fff;font-size:13px}
.bar button,.bar a{font-family:'Prompt';border:0;border-radius:999px;padding:8px 18px;margin:0 4px;cursor:pointer;color:#5C4148;background:#fff;text-decoration:none;font-size:13px;display:inline-block}
.sheet{width:148mm;height:210mm;margin:16px auto;background:#FBF8F6;padding:7mm;box-shadow:0 6px 30px rgba(92,65,72,.15)}
.card{height:100%;border:1.6px solid #C9A8AF;border-radius:9mm;display:flex;flex-direction:column;align-items:center;padding:10mm 10mm 0;text-align:center}
.heart{width:18mm}
.word{width:84mm;margin-top:4mm}
.tag{width:56mm;margin-top:2.6mm}
.names{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:34px;color:#5C4148;margin-top:8mm;letter-spacing:.01em}
.date{font-size:11.5px;color:#9C7880;letter-spacing:.18em;margin-top:1mm}
.qr{width:74mm;margin-top:6mm}
.th{font-size:24px;font-weight:400;margin-top:7mm;color:#5C4148}
.en{font-size:12.5px;letter-spacing:.22em;color:#9C7880;margin-top:2mm}
@media print{body{background:#fff}.bar{display:none}.sheet{margin:0;box-shadow:none}}
</style>
</head>
<body>
<div class="bar"><button onclick="window.print()">🖨 พิมพ์ / บันทึก PDF (A5)</button><a href="img/qr-card.png" download="AdrianaNon-QR-card.png">ดาวน์โหลดเป็นรูป PNG</a></div>
<div class="sheet"><div class="card">
  <img class="heart" src="img/heart-mauve.png" alt="">
  <img class="word" src="img/wordmark-mauve.png" alt="MAHASSAJAN">
  <img class="tag" src="img/tagline-mauve.png" alt="WEDDING PLANNER">
  <div class="names">Adriana &amp; Non</div>
  <div class="date">15 · 11 · 2026</div>
  <img class="qr" src="img/qr-site.png" alt="QR to the guest page">
  <div class="th">สแกนเพื่อค้นหาที่นั่งของคุณ</div>
  <div class="en">SCAN TO FIND YOUR SEAT</div>
</div></div>
</body>
</html>
